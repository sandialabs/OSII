[project]
name = "osii-mcp"
version = "0.1.0"
description = "FastMCP server for traversing and inspecting OSII stores through the installed osii package."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "osii"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
osii-mcp = "osii_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
osii = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["osii_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
