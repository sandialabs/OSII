site_name: OSII Documentation
site_description: Use, extend, and operate the On-Store Intelligence Index.
site_url: https://heidikmkv.github.io/osii/
repo_url: https://github.com/heidikmkv/osii
repo_name: heidikmkv/osii
docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Hosted server: operations/runbook-server.md
  - Single-server example: operations/runbook-droplet.md
  - Start here: index.md
  - Four processor APIs:
      - Start here — Python and HTTP: reference/processor-api/index.md
      - Extractor — read the source: reference/processor-api/extraction.md
      - Synthesizer — explain the evidence: reference/processor-api/synthesis.md
      - Embedder — represent text: reference/processor-api/embedding.md
      - Enricher — add knowledge: reference/processor-api/enrichment.md
      - Canonical outputs: reference/processor-api/canonical-outputs.md
      - Standard artifacts: reference/processor-api/standard-artifacts.md
  - Install and use:
