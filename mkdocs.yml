site_name: OSII Documentation
site_description: Use, extend, and operate the On-Store Intelligence Index.
site_url: https://heidikmkv.github.io/osii/
repo_url: https://github.com/heidikmkv/osii
repo_name: heidikmkv/osii
docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start here: index.md
  - Use OSII:
      - Start from source: operations/runbook-development.md
      - Model connections: operations/model-endpoints.md
      - Work without a model: operations/local-first.md
      - Shared source folders: operations/shared-drives.md
      - File inventory: operations/large-volumes.md
      - Labels, transfer, and deletion: operations/sensitive-data.md
      - Process one file: tutorials/single-file.md
      - Generate a wiki: tutorials/llm-wiki.md
      - Keyword and entity examples: tutorials/example-enrichments.md
      - Tabular datasets: tutorials/tabular-datasets.md
      - Optional Python notebooks: tutorials/python-demonstrations.md
  - Understand OSII:
      - Architecture: concepts/architecture.md
      - Extraction: concepts/extraction.md
      - Tables: concepts/tabular-extraction.md
      - Collections and enrichments: concepts/collections-and-enrichments.md
      - Synthesis: concepts/synthesis.md
      - Retrieval chunks: concepts/retrieval-chunking.md
  - Extend OSII:
      - Choose an extension: extending/index.md
      - Build a first enricher: extending/hello-enricher.md
      - Processor development: extending/processor-development.md
      - Processor modules: extending/processor-modules.md
      - Frontend workflows: extending/frontend-tools.md
      - Topic Explorer: extending/topic-explorer.md
      - RAG strategies: extending/rag-strategies.md
  - Reference:
      - CLI commands: reference/cli.md
      - REST API: reference/api/index.md
      - API resource model: reference/api/resource-model.md
      - Search semantics: reference/api/search-semantics.md
      - API compatibility: reference/api/compatibility.md
      - Processor API:
          - Python and HTTP: reference/processor-api/index.md
          - Extraction: reference/processor-api/extraction.md
          - Synthesis: reference/processor-api/synthesis.md
          - Embedding: reference/processor-api/embedding.md
          - Enrichment: reference/processor-api/enrichment.md
          - Canonical outputs: reference/processor-api/canonical-outputs.md
          - Standard artifacts: reference/processor-api/standard-artifacts.md
      - Baseline processors: operations/local-processors.md
      - Extractor routing: reference/extractor-routing.md
      - Model providers: reference/model-providers.md
      - Extraction versions: reference/extraction-versions.md
      - Collection format: reference/collection-file-format.md
      - Collection suggestions: reference/collection-suggestions.md
      - Sidecar layout: reference/osii-store.md
      - Rebuildable catalog: reference/catalog.md
      - Local storage: reference/local-storage.md
      - Library reads: reference/library-reads.md
      - Processing commits: reference/processing-commits.md
      - Authoring: reference/library-authoring.md
      - Retrieval and jobs: reference/retrieval-jobs.md
  - Contribute: contributing/developer-guide.md
