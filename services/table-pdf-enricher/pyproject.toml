[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-table-pdf-enricher"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "osii-processor-sdk",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
osii-processor-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
