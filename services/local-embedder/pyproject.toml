[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-local-embedder"
version = "0.1.0"
description = "Zero-download hashing embedding service for OSII."
requires-python = ">=3.11,<3.14"
dependencies = ["osii-processor-sdk", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.uv.sources]
osii-processor-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
