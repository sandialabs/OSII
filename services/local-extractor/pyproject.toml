[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-local-extractor"
version = "0.1.0"
description = "Container-optional baseline document extractor for OSII."
requires-python = ">=3.11,<3.14"
dependencies = [
  "osii-processor-sdk",
  "uvicorn[standard]>=0.35,<1",
  "PyMuPDF>=1.24",
  "docx2txt>=0.8",
]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.uv.sources]
osii-processor-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
