<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OSII-Tesseract Demo</title>
    <link rel="stylesheet" href="/demo/static/styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <h1>OSII-Tesseract Demo</h1>
        </header>

        <main class="app-main">
            <section class="panel controls-panel">
                <h2>Upload</h2>
                <input id="fileInput" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp">
                <button id="uploadButton" type="button">Upload</button>
                <div id="uploadStatus" class="status"></div>

                <hr>

                <h2>Document</h2>
                <label for="pageSelect">Page</label>
                <select id="pageSelect"></select>

                <hr>

                <h2>Detection</h2>

                <label class="checkbox-row">
                    <input id="autoDetect" type="checkbox" checked>
                    Auto-detect on change
                </label>

                <button id="detectButton" type="button">Detect Regions</button>

                <label for="thresholdMode">Threshold mode</label>
                <select id="thresholdMode">
                    <option value="adaptive" selected>adaptive</option>
                    <option value="otsu">otsu</option>
                </select>

                <label for="blurKernel">Blur kernel</label>
                <input id="blurKernel" type="range" min="1" max="21" step="2" value="3">
                <span id="blurKernelValue">3</span>

                <label for="adaptiveBlockSize">Adaptive block size</label>
                <input id="adaptiveBlockSize" type="range" min="3" max="101" step="2" value="31">
                <span id="adaptiveBlockSizeValue">31</span>

                <label for="adaptiveC">Adaptive C</label>
                <input id="adaptiveC" type="range" min="-20" max="40" step="1" value="15">
                <span id="adaptiveCValue">15</span>

                <label for="openKernelW">Open kernel width</label>
                <input id="openKernelW" type="range" min="1" max="20" step="1" value="2">
                <span id="openKernelWValue">2</span>

                <label for="openKernelH">Open kernel height</label>
                <input id="openKernelH" type="range" min="1" max="20" step="1" value="2">
                <span id="openKernelHValue">2</span>

                <label for="dilateKernelW">Dilate kernel width</label>
                <input id="dilateKernelW" type="range" min="1" max="100" step="1" value="9">
                <span id="dilateKernelWValue">9</span>

                <label for="dilateKernelH">Dilate kernel height</label>
                <input id="dilateKernelH" type="range" min="1" max="100" step="1" value="3">
                <span id="dilateKernelHValue">3</span>

                <label for="dilateIterations">Dilate iterations</label>
                <input id="dilateIterations" type="range" min="1" max="10" step="1" value="1">
                <span id="dilateIterationsValue">1</span>

                <label for="minContourArea">Min contour area</label>
                <input id="minContourArea" type="range" min="0" max="5000" step="10" value="50">
                <span id="minContourAreaValue">50</span>

                <label for="minWidth">Min width</label>
                <input id="minWidth" type="range" min="0" max="500" step="1" value="10">
                <span id="minWidthValue">10</span>

                <label for="minHeight">Min height</label>
                <input id="minHeight" type="range" min="0" max="500" step="1" value="8">
                <span id="minHeightValue">8</span>

                <label for="bboxPadding">BBox padding</label>
                <input id="bboxPadding" type="range" min="0" max="50" step="1" value="4">
                <span id="bboxPaddingValue">4</span>

                <label for="maxRegions">Max regions</label>
                <input id="maxRegions" type="range" min="10" max="1000" step="10" value="200">
                <span id="maxRegionsValue">200</span>

                <hr>

                <h2>OCR</h2>

                <label for="language">Language</label>
                <select id="language">
                    <option value="en" selected>en</option>
                    <option value="fr">fr</option>
                    <option value="de">de</option>
                    <option value="es">es</option>
                    <option value="ja">ja</option>
                    <option value="ko">ko</option>
                    <option value="zh">zh</option>
                    <option value="ar">ar</option>
                </select>

                <label for="tesseractPsm">Tesseract PSM</label>
                <select id="tesseractPsm">
                    <option value="auto" selected>auto - Heuristic choice based on region shape</option>
                    <option value="6">6 - Assume a uniform block of text</option>
                    <option value="7">7 - Treat image as a single text line</option>
                    <option value="8">8 - Treat image as a single word</option>
                    <option value="11">11 - Sparse text</option>
                    <option value="13">13 - Raw line</option>
                </select>

                <label for="confidenceThreshold">Confidence threshold</label>
                <input id="confidenceThreshold" type="range" min="0" max="1" step="0.01" value="0">
                <span id="confidenceThresholdValue">0.50</span>

                <button id="ocrButton" type="button">Run OCR</button>
            </section>

            <section class="panel previews-panel">
                <h2>Previews</h2>
                <div class="preview-grid">
                    <div class="preview-card">
                        <h3>Original</h3>
                        <img id="preview-original" alt="Original preview">
                    </div>
                    <div class="preview-card">
                        <h3>Gray</h3>
                        <img id="preview-gray" alt="Gray preview">
                    </div>
                    <div class="preview-card">
                        <h3>Binary</h3>
                        <img id="preview-binary" alt="Binary preview">
                    </div>
                    <div class="preview-card">
                        <h3>Cleaned</h3>
                        <img id="preview-cleaned" alt="Cleaned preview">
                    </div>
                    <div class="preview-card">
                        <h3>Dilated</h3>
                        <img id="preview-dilated" alt="Dilated preview">
                    </div>
                    <div class="preview-card preview-card-wide">
                        <h3>Detection Overlay</h3>
                        <img id="preview-overlay" alt="Detection overlay preview">
                    </div>
                    <div class="preview-card preview-card-wide">
                        <h3>OCR Overlay</h3>
                        <img id="preview-ocr-overlay" alt="OCR overlay preview">
                    </div>
                </div>
            </section>

            <section class="panel results-panel">
                <h2>Results</h2>
                <div id="detectStats" class="stats"></div>
                <div id="ocrStats" class="stats"></div>
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Text</th>
                            <th>Confidence</th>
                            <th>BBox</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="/demo/static/demo.js"></script>
</body>
</html>
