[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-tika-adapter"
version = "0.1.0"
description = "Processor API wrapper for a user-managed Apache Tika server"
requires-python = ">=3.11,<3.14"
dependencies = ["osii", "requests>=2.32,<3", "jdk4py==25.0.2.1", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["tika_adapter"]

[tool.osii.ci]
paths = ["tests"]
extras = ["dev"]
args = []
