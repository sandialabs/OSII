[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-whisper"
version = "0.1.0"
description = "Local Whisper speech-to-text processor for OSII."
requires-python = ">=3.11,<3.14"
dependencies = [
    "osii", "uvicorn[standard]>=0.35,<1", "faster-whisper==1.2.1",
    "av>=11,<20", "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["osii_whisper"]

[tool.osii.ci]
paths = ["tests"]
extras = ["dev"]
