[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-ocria"
version = "0.1.0"
description = "Optional OCRia-nano-1 Processor API adapter using LiteParse."
requires-python = ">=3.11,<3.14"
dependencies = ["osii", "uvicorn[standard]>=0.35,<1", "liteparse==2.21.1", "PyMuPDF>=1.24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["osii_ocria"]

[tool.osii.ci]
paths = ["tests"]
extras = ["dev"]
