[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-vlm-endpoint"
version = "0.1.0"
description = "Vision-language document extraction through an OpenAI-compatible endpoint."
requires-python = ">=3.11,<3.14"
dependencies = ["osii", "uvicorn[standard]>=0.35,<1", "httpx>=0.27,<1", "Pillow>=10", "PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["osii_vlm_endpoint"]

[tool.osii.ci]
paths = ["tests"]
extras = ["dev"]
