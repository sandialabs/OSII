[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "banyan-extract"
version = "1.2.5"
license = { text = "BSD 3" }
authors = [
    { name="Sandia National Laboratories" },
]
requires-python = ">=3.11,<3.14"

dependencies = [
    "python-pptx",
    "pandas",
    "python-dotenv",
    "opencv-python", 
    "numpy",
    "openai",
    "pillow",
    "pymupdf"
    ]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
marker = ["marker-pdf", "surya-ocr"]
nemotronparse = ["openai"]
autorotate = ["pytesseract"]
osii = ["osii", "uvicorn[standard]>=0.35,<1"]

[project.scripts]
banyan-extract = "banyan_extract.cli:main"

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.osii.ci]
paths = ["tests/unit/test_osii_extractor.py"]
extras = ["dev"]
args = ["--api-test-mode=mock"]
