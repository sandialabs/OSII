[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-embeddinggemma"
version = "0.1.0"
description = "Local, text-only EmbeddingGemma 2 Processor API service for OSII."
requires-python = ">=3.11,<3.14"
dependencies = ["osii", "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
osii = { path = "../../osii-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["osii_embeddinggemma"]

[tool.osii.ci]
paths = ["tests"]
extras = ["dev"]
