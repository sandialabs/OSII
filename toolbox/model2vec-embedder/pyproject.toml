[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-model2vec-embedder"
version = "0.1.0"
description = "Experimental Model2Vec embedding service for OSII."
requires-python = ">=3.11,<3.14"
dependencies = ["osii-processor-sdk", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
model2vec = ["model2vec>=0.8,<0.9"]
# These contract tests use Starlette's httpx-based TestClient.
dev = ["httpx>=0.27,<1", "starlette<1", "pytest>=8,<9"]

[tool.uv.sources]
osii-processor-sdk = { path = "../../packages/osii-processor-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
