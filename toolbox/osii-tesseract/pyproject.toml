[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-tesseract"
version = "0.2.0"
description = "Region-aware OpenCV and Tesseract OCR Processor API service for OSII."
requires-python = ">=3.11,<3.14"
dependencies = [
  "osii-processor-sdk",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart==0.0.9",
  "opencv-python-headless==4.10.0.84",
  "numpy==2.1.1",
  "pytesseract==0.3.13",
  "Pillow==10.4.0",
  "PyMuPDF==1.24.10",
  "jinja2==3.1.4",
  "pydantic>=2.11,<3",
  "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
osii-processor-sdk = { path = "../../packages/osii-processor-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
