name: osii

services:
  api:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-core:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: ai-ready-ingest/Dockerfile
      args: {OSII_VERSION: "${OSII_IMAGE_TAG:-latest}"}
    environment:
      OSII_ROOT: /data/.osii
      SHARED_VOLUME_ROOT: /data/source
      UPLOAD_ORIGINALS_ROOT: /data/uploads
      OSII_PROCESSORS: ${OSII_PROCESSORS:-http://local-extractor:8092,http://local-synthesizer:8093,http://local-embedder:8085,http://local-enricher:8094,http://model-provider-bridge:8095/ollama/embedder,http://model-provider-bridge:8095/ollama/synthesizer,http://model-provider-bridge:8095/openai/synthesizer}
      OSII_DEFAULT_SYNTHESIZER: ${OSII_DEFAULT_SYNTHESIZER:-ollama.synthesizer}
      OSII_DEFAULT_EMBEDDER: ${OSII_DEFAULT_EMBEDDER:-ollama.embedder}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      OSII_DEFAULT_EXTRACTOR: ${OSII_DEFAULT_EXTRACTOR:-local.native-text}
      OSII_DEFAULT_ENRICHER: ${OSII_DEFAULT_ENRICHER:-local.stats-keywords}
      OSII_EXTRACTOR_ROUTES_PATH: /app/config/extractor_routes_native.toml
      TIKA_URL: http://tika:9998
      OSII_TESSERACT_URL: http://tesseract:8080
      OSII_MODEL_BASE_URL: ${OSII_MODEL_BASE_URL:-}
      OSII_CHAT_BASE_URL: ${OSII_CHAT_BASE_URL:-}
      OSII_MODEL_API_KEY: ${OSII_MODEL_API_KEY:-}
      OSII_CHAT_MODEL: ${OSII_CHAT_MODEL:-}
      OSII_SYNTHESIS_MODEL: ${OSII_SYNTHESIS_MODEL:-}
      OSII_MODEL_BRIDGE_URL: http://model-provider-bridge:8095
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OSII_OLLAMA_ALLOWED_MODELS: ${OSII_OLLAMA_ALLOWED_MODELS:-all-minilm,llama3.2:1b}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-ollama}
      CHAT_PROVIDER_CHAIN: ${CHAT_PROVIDER_CHAIN:-ollama,extractive}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:1b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      SHIRTY_BASE_URL: ${SHIRTY_BASE_URL:-}
      SHIRTY_API_KEY: ${SHIRTY_API_KEY:-}
      SHIRTY_EMBEDDING_MODEL: ${SHIRTY_EMBEDDING_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHIRTY_SYNTHESIS_MODEL: ${SHIRTY_SYNTHESIS_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      SHIRTY_CHAT_MODEL: ${SHIRTY_CHAT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    ports:
      - "${OSII_API_PORT:-8511}:8511"
    volumes:
      - osii-data:/data
      - "${OSII_SOURCE_DIR:-./osii-data/source}:/data/source:ro"
    depends_on:
      local-embedder:
        condition: service_healthy
      model-provider-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8511/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-core:${OSII_IMAGE_TAG:-latest}"
    command: ["python", "-m", "osii.worker"]
    environment:
      OSII_ROOT: /data/.osii
      SHARED_VOLUME_ROOT: /data/source
      UPLOAD_ORIGINALS_ROOT: /data/uploads
      TIKA_URL: http://tika:9998
      OSII_TESSERACT_URL: http://tesseract:8080
      OSII_PROCESSORS: ${OSII_PROCESSORS:-http://local-extractor:8092,http://local-synthesizer:8093,http://local-embedder:8085,http://local-enricher:8094,http://model-provider-bridge:8095/ollama/embedder,http://model-provider-bridge:8095/ollama/synthesizer,http://model-provider-bridge:8095/openai/synthesizer}
      OSII_DEFAULT_SYNTHESIZER: ${OSII_DEFAULT_SYNTHESIZER:-ollama.synthesizer}
      OSII_DEFAULT_EMBEDDER: ${OSII_DEFAULT_EMBEDDER:-ollama.embedder}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      OSII_DEFAULT_EXTRACTOR: ${OSII_DEFAULT_EXTRACTOR:-local.native-text}
      OSII_DEFAULT_ENRICHER: ${OSII_DEFAULT_ENRICHER:-local.stats-keywords}
      OSII_EXTRACTOR_ROUTES_PATH: /app/config/extractor_routes_native.toml
      OSII_MODEL_BASE_URL: ${OSII_MODEL_BASE_URL:-}
      OSII_CHAT_BASE_URL: ${OSII_CHAT_BASE_URL:-}
      OSII_MODEL_API_KEY: ${OSII_MODEL_API_KEY:-}
      OSII_CHAT_MODEL: ${OSII_CHAT_MODEL:-}
      OSII_SYNTHESIS_MODEL: ${OSII_SYNTHESIS_MODEL:-}
      OSII_MODEL_BRIDGE_URL: http://model-provider-bridge:8095
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OSII_WORKER_POLL_SECONDS: ${OSII_WORKER_POLL_SECONDS:-1}
    volumes:
      - osii-data:/data
      - "${OSII_SOURCE_DIR:-./osii-data/source}:/data/source:ro"
    depends_on:
      api:
        condition: service_healthy
      local-embedder:
        condition: service_healthy

  dashboard:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-dashboard:${OSII_IMAGE_TAG:-latest}"
    build:
      context: osii-dashboard/dashboard
      dockerfile: Dockerfile
      args: {OSII_VERSION: "${OSII_IMAGE_TAG:-latest}"}
    ports:
      - "${OSII_DASHBOARD_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

  mcp:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-mcp:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: ai-ready-mcp/Dockerfile
    environment:
      OSII_ROOT: /data/.osii
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8022
      DEBUG: ${MCP_DEBUG:-true}
      ATLAS_MCP_TOKEN: ${ATLAS_MCP_TOKEN:-local-development}
    ports:
      - "${OSII_MCP_PORT:-8022}:8022"
    volumes:
      - osii-data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    profiles: ["agents"]

  table-pdf-enricher:
    build:
      context: .
      dockerfile: services/table-pdf-enricher/Dockerfile
    ports:
      - "${OSII_EXAMPLE_PROCESSOR_PORT:-8091}:8091"
    profiles: ["examples"]

  tesseract:
    build:
      context: ai-ready-tool-shelf/osii-tesseract
    ports:
      - "${OSII_TESSERACT_PORT:-8080}:8080"
    profiles: ["ocr"]

  tika:
    image: apache/tika:3.2.3.0-full
    ports:
      - "${OSII_TIKA_PORT:-9998}:9998"
    profiles: ["ocr"]

  local-extractor:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-baseline-processors:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: services/baseline-processors/Dockerfile
      args: &baseline-build-args {OSII_VERSION: "${OSII_IMAGE_TAG:-latest}"}
    command: ["extractor"]
    ports: ["${OSII_LOCAL_EXTRACTOR_PORT:-8092}:8092"]
    healthcheck: &processor-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ['PORT'] + '/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment: {PORT: "8092"}

  local-synthesizer:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-baseline-processors:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: services/baseline-processors/Dockerfile
      args: *baseline-build-args
    command: ["synthesizer"]
    ports: ["${OSII_LOCAL_SYNTHESIZER_PORT:-8093}:8093"]
    healthcheck: *processor-health
    environment: {PORT: "8093"}

  local-embedder:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-baseline-processors:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: services/baseline-processors/Dockerfile
      args: *baseline-build-args
    command: ["embedder"]
    ports: ["${OSII_EMBEDDINGS_PORT:-8085}:8085"]
    healthcheck: *processor-health
    environment: {PORT: "8085"}

  local-enricher:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-baseline-processors:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: services/baseline-processors/Dockerfile
      args: *baseline-build-args
    command: ["enricher"]
    ports: ["${OSII_LOCAL_ENRICHER_PORT:-8094}:8094"]
    healthcheck: *processor-health
    environment: {PORT: "8094"}

  model-provider-bridge:
    image: "${OSII_IMAGE_PREFIX:-localhost/osii}-baseline-processors:${OSII_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: services/baseline-processors/Dockerfile
      args: *baseline-build-args
    command: ["model-bridge"]
    ports: ["${OSII_MODEL_BRIDGE_PORT:-8095}:8095"]
    healthcheck: *processor-health
    environment:
      OSII_ROOT: /data/.osii
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
      OLLAMA_SYNTHESIS_MODEL: ${OLLAMA_SYNTHESIS_MODEL:-llama3.2:1b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OSII_MODEL_BASE_URL: ${OSII_MODEL_BASE_URL:-}
      OSII_MODEL_API_KEY: ${OSII_MODEL_API_KEY:-}
      OSII_MODEL_API_KEY_ENV: ${OSII_MODEL_API_KEY_ENV:-OSII_MODEL_API_KEY}
      OSII_SYNTHESIS_MODEL: ${OSII_SYNTHESIS_MODEL:-}
      SHIRTY_BASE_URL: ${SHIRTY_BASE_URL:-}
      SHIRTY_API_KEY: ${SHIRTY_API_KEY:-}
      SHIRTY_EMBEDDING_MODEL: ${SHIRTY_EMBEDDING_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHIRTY_SYNTHESIS_MODEL: ${SHIRTY_SYNTHESIS_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      SHIRTY_CHAT_MODEL: ${SHIRTY_CHAT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      PORT: "8095"
    volumes:
      - osii-data:/data:ro

volumes:
  osii-data:
