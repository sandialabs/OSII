server {
    listen 8080;
    server_name _;

    location ~ ^/(api|artifact)/ {
        proxy_pass http://api:8511;
        proxy_set_header Host $host;
    }

    # Keep the dashboard's single public origin useful for both people and
    # deployment checks; the API itself owns the health endpoint.
    location = /health {
        proxy_pass http://api:8511/health;
        proxy_set_header Host $host;
    }

    # PDF.js is emitted as an ES-module worker. Alpine Nginx does not map the
    # `.mjs` extension by default, so serve it with a module-compatible MIME.
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
