server {
    listen 8080;
    server_name _;

    location /api/chat {
        proxy_pass http://chat:8611;
        proxy_set_header Host $host;
    }

    location ~ ^/(api|artifact)/ {
        proxy_pass http://api:8511;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

