worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location ~ ^/(api|artifact)/ {
            proxy_pass http://api:8511;
            proxy_set_header Host $host;
        }

        # Keep the dashboard's single public origin useful for both people and
        # deployment checks; the API itself owns the health endpoint.
        location = /health {
            proxy_pass http://api:8511/health;
            proxy_set_header Host $host;
        }

        # PDF.js emits an ES-module worker. Serve .mjs with a module-compatible
        # MIME type even when the base image's MIME table does not define it.
        location ~ \.mjs$ {
            default_type application/javascript;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
