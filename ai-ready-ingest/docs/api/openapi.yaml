openapi: 3.1.0
info:
  title: AI-Ready-Ingest API
  version: 0.1.0
  summary: Resource-oriented backend API for ingestion, canonical object access, collections, enrichments, and search.
  description: |
    This OpenAPI document describes the current implemented backend API surface for AI-Ready-Ingest.

    The preferred public API is centered on:

    - scope resources
    - collection resources
    - object resources
    - text-span resources
    - enrichment resources
    - search resources

    Compatibility read routes under `/api/osii/...` still exist in the application, but are not the preferred API for new consumers and are not fully modeled here.

    Removed route families such as `/api/dashboard/...` and dashboard/workbench HTML routes are intentionally not documented in this specification.
servers:
  - url: http://localhost:8511
    description: Default local development server
tags:
  - name: scopes
    description: Scope discovery and scope membership resolution
  - name: collections
    description: Curated collection resources and membership management
  - name: objects
    description: Canonical object aggregates, manifests, text representations, and syntheses
  - name: text
    description: Canonical grounded text-span access over object text
  - name: enrichments
    description: Derived enrichment listing and object enrichment payload retrieval
  - name: search
    description: Public semantic search over derived chunks with canonical grounding fields
  - name: discovery
    description: Extractor and synthesizer discovery
  - name: runs
    description: Ingestion run orchestration and run status
  - name: embeddings
    description: Embedding build orchestration and embedding metadata
  - name: artifacts
    description: OSII-relative artifact file serving
  - name: synthesis-jobs
    description: Direct synthesis initiation over existing objects and collections
  - name: enrichment-jobs
    description: Direct enrichment initiation over supported scopes

paths:
  /api/scopes/root:
    get:
      tags:
        - scopes
      summary: Get the root scope descriptor and member file identifiers
      operationId: getRootScope
      responses:
        '200':
          description: Root scope and member file identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeMembersResponse'
              examples:
                default:
                  value:
                    scope:
                      scope_type: root
                      scope_id: root
                      label: root
                    member_file_ids:
                      - sha256-test123
        default:
          $ref: '#/components/responses/GenericError'

  /api/scopes/artifacts:
    post:
      tags:
        - scopes
      summary: Get artifact summary for a resolved scope
      description: |
        Returns artifact availability and actions for a resolved scope.

        Supported request variants are:

        - root
        - folder by `folder_id`
        - collection by `collection_id`
        - object by `file_id`

        The response includes:

        - resolved `scope`
        - `artifact_summary`
        - `actions`

        Scope-level artifact summaries are especially useful for folder, collection, and root views that need to determine whether scope-level synthesis or enrichment outputs already exist.
      operationId: getScopeArtifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeArtifactsRequest'
            examples:
              folder_scope:
                value:
                  scope:
                    scope_type: folder
                    folder_id: folder-root
              collection_scope:
                value:
                  scope:
                    scope_type: collection
                    collection_id: col-abc123def456
      responses:
        '200':
          description: Resolved scope and artifact summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeArtifactsResponse'
              examples:
                folder_scope:
                  value:
                    scope:
                      scope_type: folder
                      scope_id: folder-root
                      folder_id: folder-root
                      path: experiments/run_01
                      label: run_01
                    artifact_summary:
                      member_count: 12
                      has_synthesis: true
                      synthesis_preview: This folder appears to contain one experiment run with calibration outputs and supporting notes.
                      syntheses:
                        - name: current
                          relpath: folders/folder-folder-root.synth.txt
                      has_enrichments: false
                      enrichments: []
                    actions:
                      can_synthesize: true
                      can_enrich: true
        default:
          $ref: '#/components/responses/GenericError'

  /api/scopes/folders:
    get:
      tags:
        - scopes
      summary: List folder scope descriptors
      description: Returns a flat catalog of folder scope descriptors. This is not a tree response.
      operationId: listFolderScopes
      responses:
        '200':
          description: Folder scope descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderScopeListResponse'
              examples:
                default:
                  value:
                    scopes:
                      - scope_type: folder
                        scope_id: folder-root
                        folder_id: folder-root
                        path: ""
                        label: root-folder
        default:
          $ref: '#/components/responses/GenericError'

  /api/scopes/collections:
    get:
      tags:
        - scopes
      summary: List collection scope descriptors
      description: Returns scope descriptors for collections, not full collection resources.
      operationId: listCollectionScopes
      responses:
        '200':
          description: Collection scope descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionScopeListResponse'
              examples:
                default:
                  value:
                    scopes:
                      - scope_type: collection
                        scope_id: col-abc123def456
                        collection_id: col-abc123def456
                        label: sensor-calibration-review
                        kind: file-list
                        description: Documents related to calibration methods and drift analysis.
                        document_count: 2
        default:
          $ref: '#/components/responses/GenericError'

  /api/scopes/describe:
    post:
      tags:
        - scopes
      summary: Resolve and describe a scope
      description: |
        Supported request variants are:

        - root
        - folder by `folder_id`
        - collection by `collection_id`
        - object by `file_id`
      operationId: describeScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeDescribeRequest'
            examples:
              root:
                value:
                  scope_type: root
              folder:
                value:
                  scope_type: folder
                  folder_id: folder-root
              collection:
                value:
                  scope_type: collection
                  collection_id: col-abc123def456
              object:
                value:
                  scope_type: object
                  file_id: sha256-test123
      responses:
        '200':
          description: Resolved scope and member file identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeMembersResponse'
              examples:
                root:
                  value:
                    scope:
                      scope_type: root
                      scope_id: root
                      label: root
                    member_file_ids:
                      - sha256-test123
                folder:
                  value:
                    scope:
                      scope_type: folder
                      scope_id: folder-root
                      folder_id: folder-root
                      path: ""
                      label: root-folder
                    member_file_ids:
                      - sha256-test123
                collection:
                  value:
                    scope:
                      scope_type: collection
                      scope_id: col-abc123def456
                      collection_id: col-abc123def456
                      label: sensor-calibration-review
                    member_file_ids:
                      - sha256-test123
                object:
                  value:
                    scope:
                      scope_type: object
                      scope_id: sha256-test123
                      file_id: sha256-test123
                      label: sha256-test123
                    member_file_ids:
                      - sha256-test123
        default:
          $ref: '#/components/responses/GenericError'

  /api/scopes/summaries:
    post:
      tags:
        - scopes
      summary: Get compact object summaries for all objects resolved from a scope
      description: |
        Returns lightweight object summaries for all objects resolved from the requested scope.

        Preferred request form wraps the scope object in a `scope` property:

        ```json
        {
          "scope": {
            "scope_type": "collection",
            "collection_id": "col-abc123def456"
          }
        }
        ```

        Current implementation also accepts the direct scope object as the entire request body, but the wrapped form is the preferred public contract.

        Current behavior:

        - supported scope variants are root, folder, collection, and object
        - missing or invalid members are silently skipped
        - returned summaries follow resolved member order
        - no pagination or truncation fields are currently part of the contract
      operationId: getScopeSummaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeSummariesRequest'
            examples:
              collection_scope:
                value:
                  scope:
                    scope_type: collection
                    collection_id: col-abc123def456
              folder_scope:
                value:
                  scope:
                    scope_type: folder
                    folder_id: folder-root
      responses:
        '200':
          description: Compact summaries for objects resolved from the requested scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeSummariesResponse'
              examples:
                default:
                  value:
                    scope:
                      scope_type: collection
                      collection_id: col-abc123def456
                    summaries:
                      - file_id: sha256-test123
                        filename: example.pdf
                        source_relpath: reports/example.pdf
                        source_file_relpath: reports/example.pdf
                        mime: application/pdf
                        collections:
                          - id: col-abc123def456
                            name: sensor-calibration-review
                            kind: file-list
                        processing:
                          extractor:
                            name: null
                            display_name: null
                          synthesizer:
                            name: null
                            display_name: null
                          canonical_text_path: objects/sha256-test123/text.txt
                          editable_text_path: null
                          has_editable_text: false
                          capabilities:
                            supports_markdown_render: false
                        source_state:
                          file_id: sha256-test123
                          status: active
                          source_relpath: reports/example.pdf
                        has_preferred_text: true
                        preferred_text_kind: canonical_extracted_text
                        has_synthesis: true
                        has_enrichments: true
                        synthesis_preview: This appears to be a technical report about thermal calibration drift.
                        preview_available: true
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections:
    get:
      tags:
        - collections
      summary: List collections
      operationId: listCollections
      responses:
        '200':
          description: Collection resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
              examples:
                default:
                  value:
                    collections:
                      - id: col-abc123def456
                        name: sensor-calibration-review
                        description: Documents related to calibration methods and drift analysis.
                        kind: file-list
                        color: '#3366ff'
                        document_count: 2
                        created_utc: '2026-06-18T12:00:00Z'
                        updated_utc: '2026-06-18T12:05:00Z'
        default:
          $ref: '#/components/responses/GenericError'

    post:
      tags:
        - collections
      summary: Create a collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
            examples:
              default:
                value:
                  name: sensor-calibration-review
                  description: Documents related to calibration methods and drift analysis.
                  kind: file-list
                  color: '#3366ff'
      responses:
        '200':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEnvelope'
              examples:
                default:
                  value:
                    collection:
                      id: col-abc123def456
                      name: sensor-calibration-review
                      description: Documents related to calibration methods and drift analysis.
                      kind: file-list
                      color: '#3366ff'
                      document_count: 0
                      created_utc: '2026-06-18T12:00:00Z'
                      updated_utc: '2026-06-18T12:00:00Z'
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections/{collection_id}:
    get:
      tags:
        - collections
      summary: Get a collection
      operationId: getCollection
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      responses:
        '200':
          description: Collection resource and artifact summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetailResponse'
              examples:
                default:
                  value:
                    collection:
                      id: col-abc123def456
                      name: sensor-calibration-review
                      description: Documents related to calibration methods and drift analysis.
                      kind: file-list
                      color: '#3366ff'
                      document_count: 2
                      created_utc: '2026-06-18T12:00:00Z'
                      updated_utc: '2026-06-18T12:05:00Z'
                    artifact_summary:
                      collection_id: col-abc123def456
                      artifacts:
                        member_count: 2
                        has_synthesis: true
                        has_enrichments: true
                        syntheses:
                          - name: collection_firstn.txt
                            relpath: collections/col-abc123def456/syntheses/collection_firstn.txt
                        enrichments:
                          - name: wiki--llm_wiki_stub
                            kind: bundle
                            relpath: collections/col-abc123def456/enrichments/wiki--llm_wiki_stub
                            files:
                              - name: index.md
                                relpath: collections/col-abc123def456/enrichments/wiki--llm_wiki_stub/index.md
                                is_dir: false
                      actions:
                        can_synthesize: true
                        can_enrich: true
        default:
          $ref: '#/components/responses/GenericError'

    patch:
      tags:
        - collections
      summary: Update a collection
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdateRequest'
            examples:
              default:
                value:
                  description: Updated description
                  kind: manual
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEnvelope'
              examples:
                default:
                  value:
                    collection:
                      id: col-abc123def456
                      name: sensor-calibration-review
                      description: Updated description
                      kind: manual
                      color: '#3366ff'
                      document_count: 2
                      created_utc: '2026-06-18T12:00:00Z'
                      updated_utc: '2026-06-18T12:05:00Z'
        default:
          $ref: '#/components/responses/GenericError'

    delete:
      tags:
        - collections
      summary: Delete a collection
      operationId: deleteCollection
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      responses:
        '200':
          description: Collection deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection_id:
                    type: string
                  deleted:
                    type: boolean
                required:
                  - collection_id
                  - deleted
                additionalProperties: false
              examples:
                default:
                  value:
                    collection_id: col-abc123def456
                    deleted: true
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections/{collection_id}/members:
    get:
      tags:
        - collections
      summary: Get collection membership
      operationId: getCollectionMembers
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      responses:
        '200':
          description: Collection and member file identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionMembersResponse'
              examples:
                default:
                  value:
                    collection:
                      id: col-abc123def456
                      name: sensor-calibration-review
                      description: Documents related to calibration methods and drift analysis.
                      kind: file-list
                      color: '#3366ff'
                      document_count: 2
                      created_utc: '2026-06-18T12:00:00Z'
                      updated_utc: '2026-06-18T12:05:00Z'
                    file_ids:
                      - sha256-test123
        default:
          $ref: '#/components/responses/GenericError'

    post:
      tags:
        - collections
      summary: Add object members to a collection
      description: Batch-oriented membership add. The operation is effectively idempotent and distinguishes newly added from already-present members.
      operationId: addCollectionMembers
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMembersAddRequest'
            examples:
              default:
                value:
                  file_ids:
                    - sha256-test123
                    - sha256-test456
      responses:
        '200':
          description: Membership update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionMembersAddResponse'
              examples:
                default:
                  value:
                    collection_id: col-abc123def456
                    added:
                      - sha256-test456
                    already_present:
                      - sha256-test123
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections/{collection_id}/members/{file_id}:
    delete:
      tags:
        - collections
      summary: Remove an object member from a collection
      description: Success/no-op style removal. If the collection exists but the file is not a current member, the response reports `removed: false`.
      operationId: removeCollectionMember
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
        - $ref: '#/components/parameters/FileIdPathParam'
      responses:
        '200':
          description: Membership removal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionMemberRemoveResponse'
              examples:
                removed:
                  value:
                    collection_id: col-abc123def456
                    file_id: sha256-test123
                    removed: true
                not_present:
                  value:
                    collection_id: col-abc123def456
                    file_id: sha256-test999
                    removed: false
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections/{collection_id}/artifacts:
    get:
      tags:
        - collections
      summary: Get collection artifact summary
      operationId: getCollectionArtifacts
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      responses:
        '200':
          description: Collection artifact summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionArtifactSummary'
              examples:
                default:
                  value:
                    collection_id: col-abc123def456
                    artifacts:
                      member_count: 2
                      has_synthesis: true
                      has_enrichments: true
                      syntheses:
                        - name: collection_firstn.txt
                          relpath: collections/col-abc123def456/syntheses/collection_firstn.txt
                      enrichments:
                        - name: wiki--llm_wiki_stub
                          kind: bundle
                          relpath: collections/col-abc123def456/enrichments/wiki--llm_wiki_stub
                          files:
                            - name: index.md
                              relpath: collections/col-abc123def456/enrichments/wiki--llm_wiki_stub/index.md
                              is_dir: false
                    actions:
                      can_synthesize: true
                      can_enrich: true
        default:
          $ref: '#/components/responses/GenericError'

  /api/collections/{collection_id}/syntheses:
    get:
      tags:
        - collections
      summary: List collection synthesis artifacts
      operationId: getCollectionSyntheses
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      responses:
        '200':
          description: Collection synthesis listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSynthesesResponse'
              examples:
                default:
                  value:
                    collection:
                      id: col-abc123def456
                      name: sensor-calibration-review
                      description: Documents related to calibration methods and drift analysis.
                      kind: file-list
                      color: '#3366ff'
                      document_count: 2
                      created_utc: '2026-06-18T12:00:00Z'
                      updated_utc: '2026-06-18T12:05:00Z'
                    syntheses:
                      - name: collection_firstn.txt
                        relpath: collections/col-abc123def456/syntheses/collection_firstn.txt
        default:
          $ref: '#/components/responses/GenericError'

    post:
      tags:
        - collections
      summary: Start collection synthesis
      operationId: runCollectionSynthesis
      parameters:
        - $ref: '#/components/parameters/CollectionIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionSynthesisRequest'
            examples:
              default:
                value:
                  synthesizer_name: collection_firstn
                  synthesizer_config:
                    max_chars: 4000
      responses:
        '200':
          description: Collection synthesis job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSynthesisJobResponse'
              examples:
                default:
                  value:
                    run_id: abc123
                    status: pending
                    collection_id: col-abc123def456
                    synthesizer_name: collection_firstn
        default:
          $ref: '#/components/responses/GenericError'
  /api/objects/{file_id}:
    get:
      tags:
        - objects
      summary: Get an object aggregate
      description: |
        Returns the preferred object-oriented read surface for one canonical object.

        The aggregate currently includes:

        - `file_id`
        - `meta`
        - `overview`
        - `collections`
        - `processing`
        - `enrichments`
        - `artifact_summary`
      operationId: getObject
      parameters:
        - $ref: '#/components/parameters/FileIdPathParam'
      responses:
        '200':
          description: Object aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAggregate'
              examples:
                default:
                  value:
                    file_id: sha256-test123
                    meta:
                      file:
                        source_relpath: reports/example.pdf
                        filename: example.pdf
                        mime: application/pdf
                        size_bytes: 1234
                        mtime_utc: '2026-05-21T00:00:00Z'
                      hash:
                        sha256: test123
                    overview:
                      file_id: sha256-test123
                      meta:
                        file:
                          source_relpath: reports/example.pdf
                          filename: example.pdf
                          mime: application/pdf
                          size_bytes: 1234
                          mtime_utc: '2026-05-21T00:00:00Z'
                        hash:
                          sha256: test123
                      text_count: 1
                      image_count: 0
                      has_synth: true
                      text_items:
                        - kind: text
                          id: seg-000001
                          path: text.txt
                          type: page
                          span:
                            char_start: 0
                            char_end: 38
                          source_origin:
                            source_type: pdf
                            unit_type: page
                            page: 1
                          related_ids: []
                      image_items: []
                    collections:
                      - id: col-abc123def456
                        name: sensor-calibration-review
                        kind: file-list
                    processing:
                      extractor:
                        name: null
                        display_name: null
                      synthesizer:
                        name: null
                        display_name: null
                      canonical_text_path: objects/sha256-test123/text.txt
                      editable_text_path: null
                      has_editable_text: false
                      capabilities:
                        supports_markdown_render: false
                    enrichments:
                      - name: keywords--stats_keywords.json
                        kind: file
                        relpath: objects/sha256-test123/enrichments/keywords--stats_keywords.json
                    artifact_summary:
                      file_id: sha256-test123
                      source_state:
                        file_id: sha256-test123
                        status: active
                        source_relpath: reports/example.pdf
                      artifacts:
                        has_extraction: true
                        has_synthesis: true
                        has_enrichments: true
                        manifest_record_count: 1
                        text_representations:
                          - name: canonical
                            kind: canonical_extracted_text
                            path: objects/sha256-test123/text.txt
                            exists: true
                            preferred: true
                        syntheses:
                          - name: current
                            text_path: C:\...\ .osii\objects\sha256-test123\synth.txt
                            toml_path: C:\...\ .osii\objects\sha256-test123\synth.toml
                            scope: object
                        enrichments:
                          - name: keywords--stats_keywords.json
                            kind: file
                            relpath: objects/sha256-test123/enrichments/keywords--stats_keywords.json
                      actions:
                        can_extract: true
                        can_synthesize: true
                        can_enrich: true
                        source_is_active: true
        default:
          $ref: '#/components/responses/GenericError'

  /api/objects/summaries:
    post:
      tags:
        - objects
      summary: Get compact summaries for multiple objects
      description: |
        Returns compact object summaries for the requested file identifiers.

        Current implementation behavior:

        - `file_ids` is required
        - summaries are returned only for found objects
        - missing or invalid file identifiers are silently skipped
        - returned summaries preserve request order for found objects
      operationId: getObjectSummaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectSummariesRequest'
            examples:
              default:
                value:
                  file_ids:
                    - sha256-a
                    - sha256-b
      responses:
        '200':
          description: Compact summaries for found objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectSummariesResponse'
              examples:
                default:
                  value:
                    summaries:
                      - file_id: sha256-test123
                        filename: example.pdf
                        source_relpath: reports/example.pdf
                        source_file_relpath: reports/example.pdf
                        mime: application/pdf
                        collections:
                          - id: col-abc123def456
                            name: sensor-calibration-review
                            kind: file-list
                        processing:
                          extractor:
                            name: null
                            display_name: null
                          synthesizer:
                            name: null
