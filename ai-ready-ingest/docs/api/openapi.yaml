              examples:
                default:
                  value:
                    file_id: sha256-test123
                    representation: edited
                    updated: true
                    segments:
                      - id: seg-000001
                        text: Corrected text for this segment.
                    stale:
                      embeddings: true
                      search_chunks: true
        default:
          $ref: '#/components/responses/GenericError'

    delete:
      tags:
        - objects
      summary: Remove edited text for an object
      description: |
        Removes the edited text representation for an object.

        Semantics:

        - canonical extracted text remains unchanged
        - removing edited text restores canonical text as the preferred text representation
        - embeddings and search-derived chunks are marked stale after edit removal
      operationId: deleteEditedObjectText
      parameters:
