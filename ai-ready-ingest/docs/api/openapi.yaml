      description: |
        Returns the edited text representation for an object, if present.

        Semantics:

        - canonical extracted text remains unchanged
        - edited text is stored separately
        - edited text becomes the preferred text representation when present
        - segment identifiers are stable canonical manifest identifiers
        - source and page grounding remain valid at the segment level
      operationId: getEditedObjectText
      parameters:
        - $ref: '#/components/parameters/FileIdPathParam'
