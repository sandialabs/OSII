    get:
      tags:
        - runs
      summary: Get run status
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunIdPathParam'
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
              examples:
                default:
                  value:
                    id: c6b6d8...
                    status: running
                    completed: 3
                    total: 12
                    items:
                      - path: C:\...\Q2_Status_Report.pdf
                        display: my_data/reports/Q2_Status_Report.pdf
                        status: done
                        extractor: pdf_default
                        synthesizer: firstN
                        file_id: sha256-...
                        osii: objects/sha256-...
                        synthesis: objects/sha256-.../synth.txt
                        error: null
                    logs: []
                    manifest_name: intake-manifest-...
                    manifest_path: C:\...\.osii\manifests\...
        default:
          $ref: '#/components/responses/GenericError'

  /api/runs/{run_id}/logs:
    get:
      tags:
        - runs
      summary: Get run logs
      operationId: getRunLogs
      parameters:
        - $ref: '#/components/parameters/RunIdPathParam'
      responses:
        '200':
          description: Run logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLogsResponse'
              examples:
                default:
                  value:
                    run_id: c6b6d8...
                    logs:
                      - '[12:15:01] Run started.'
                      - "[12:15:04] Processing Q2_Status_Report.pdf with extractor 'pdf_default'"
                      - '[12:15:18] Extraction complete: Q2_Status_Report.pdf'
        default:
          $ref: '#/components/responses/GenericError'

  /api/embeddings/build:
    post:
      tags:
        - embeddings
      summary: Start an embeddings build
      description: |
        Starts a derived embeddings build over extracted content.

        Current implementation details:

        - embeddings are rebuildable
        - FAISS and mapping files are used
        - chunking metadata such as chunk method and chunk manifest are part of the current implementation
      operationId: buildEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsBuildRequest'
            examples:
              default:
                value:
                  batch_size: 1
      responses:
        '200':
          description: Embeddings build started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsBuildResponse'
              examples:
                default:
                  value:
                    job_id: segments
                    status: running
        default:
          $ref: '#/components/responses/GenericError'

  /api/embeddings/build/{job_id}:
    get:
      tags:
        - embeddings
      summary: Get embeddings build status
      operationId: getEmbeddingsBuild
      parameters:
        - $ref: '#/components/parameters/JobIdPathParam'
      responses:
        '200':
          description: Embeddings build status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsBuildStatusResponse'
              examples:
                default:
                  value:
                    job_id: segments
                    status: running
        default:
          $ref: '#/components/responses/GenericError'

  /api/embeddings/meta:
    get:
      tags:
        - embeddings
      summary: Get embeddings metadata
      description: Returns implementation-aligned metadata about the current embeddings build artifacts.
      operationId: getEmbeddingsMeta
      responses:
        '200':
          description: Embeddings metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsMetaResponse'
              examples:
                default:
                  value:
                    index_path: C:\...\.osii\embeddings\segments.faiss
                    mapping_path: C:\...\.osii\embeddings\segments.mapping.jsonl
                    meta_path: C:\...\.osii\embeddings\segments.meta.toml
                    meta_text: "[embeddings]\nmodel = \"osii-local-hashing-v1\"\n..."
                    chunk_manifest_path: C:\...\.osii\embeddings\chunks\chunks.jsonl
                    chunk_method: paragraph
        default:
          $ref: '#/components/responses/GenericError'

  /artifact/{file_path}:
    get:
      tags:
        - artifacts
      summary: Serve an OSII-relative artifact path
      description: |
        Serves OSII-relative artifact paths only.

        Security and behavior notes:

        - this is not arbitrary filesystem serving
        - path traversal protections are enforced
        - the route is intended for known artifact files under the OSII store
      operationId: getArtifact
      parameters:
        - $ref: '#/components/parameters/ArtifactFilePathParam'
      responses:
        '200':
          description: Artifact content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/GenericError'

components:
  parameters:
    FileIdPathParam:
      name: file_id
      in: path
      required: true
      description: Stable object identifier
      schema:
        type: string
        examples:
          - sha256-test123

    CollectionIdPathParam:
      name: collection_id
      in: path
      required: true
      description: Stable collection identifier
      schema:
        type: string
        examples:
          - col-abc123def456

    RunIdPathParam:
      name: run_id
      in: path
      required: true
      description: Ingestion run identifier
      schema:
        type: string

    JobIdPathParam:
      name: job_id
      in: path
      required: true
      description: Background job identifier
      schema:
        type: string

    FilenamePathParam:
      name: filename
      in: path
      required: true
      description: Filename relative to a known object enrichment directory
      schema:
        type: string

    ArtifactFilePathParam:
      name: file_path
      in: path
      required: true
      description: OSII-relative artifact path
      schema:
        type: string

    CharStartQueryParam:
      name: char_start
      in: query
      required: true
      description: Inclusive start offset into canonical object text
      schema:
        type: integer
        minimum: 0

    CharEndQueryParam:
      name: char_end
      in: query
      required: true
      description: Exclusive end offset into canonical object text
      schema:
        type: integer
        minimum: 0

    ContextCharsQueryParam:
      name: context_chars
      in: query
      required: false
      description: Number of context characters to include around the requested span
      schema:
        type: integer
        minimum: 0
        default: 200

    SearchQueryParam:
      name: q
      in: query
      required: true
      description: Free-text semantic search query
      schema:
        type: string

    SearchGroupBy:
      type: string
      enum:
        - file
      example: file

    TopKQueryParam:
      name: top_k
      in: query
      required: false
      description: Maximum number of search results to return
      schema:
        type: integer
        minimum: 1
        default: 5

  schemas:
    ErrorResponse:
      type: object
      description: |
        Generic JSON error envelope.

        Note: some currently implemented routes may return error-like JSON bodies with HTTP 200 rather than strict 4xx semantics. That behavior is implementation-aligned and should be normalized later.
      properties:
        error:
          type: string
        detail:
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
      additionalProperties: true

    ScopeType:
      type: string
      enum:
        - root
        - folder
        - collection
        - object
    ScopeArtifactsRequest:
      type: object
      required:
        - scope
      properties:
        scope:
          $ref: '#/components/schemas/ScopeDescribeRequest'
      additionalProperties: false

    ScopeSynthesisArtifact:
      type: object
      required:
        - name
        - relpath
      properties:
        name:
          type: string
          example: current
        relpath:
          type: string
          example: folders/folder-folder-root.synth.txt
      additionalProperties: false

    ScopeArtifactSummary:
      type: object
      required:
        - member_count
        - has_synthesis
        - synthesis_preview
        - syntheses
        - has_enrichments
        - enrichments
      properties:
        member_count:
          type: integer
          minimum: 0
          example: 12
        has_synthesis:
          type: boolean
          example: true
        synthesis_preview:
          type:
            - string
            - 'null'
          example: This folder appears to contain one experiment run with calibration outputs and supporting notes.
        syntheses:
          type: array
          items:
            $ref: '#/components/schemas/ScopeSynthesisArtifact'
        has_enrichments:
          type: boolean
          example: false
        enrichments:
          type: array
          items:
            $ref: '#/components/schemas/EnrichmentListEntry'
      additionalProperties: false

    ScopeArtifactActions:
      type: object
      required:
        - can_synthesize
        - can_enrich
      properties:
        can_synthesize:
          type: boolean
          example: true
        can_enrich:
          type: boolean
          example: true
      additionalProperties: false

    ScopeArtifactsResponse:
      type: object
      required:
        - scope
        - artifact_summary
        - actions
      properties:
        scope:
          $ref: '#/components/schemas/ScopeDescriptor'
        artifact_summary:
          $ref: '#/components/schemas/ScopeArtifactSummary'
        actions:
          $ref: '#/components/schemas/ScopeArtifactActions'
      additionalProperties: false
      
    RootScopeDescriptor:
      type: object
      required:
        - scope_type
        - scope_id
        - label
      properties:
        scope_type:
          type: string
          const: root
        scope_id:
          type: string
          const: root
        label:
          type: string
          example: root
      additionalProperties: false

    FolderScopeDescriptor:
      type: object
      required:
        - scope_type
        - scope_id
        - folder_id
        - path
        - label
      properties:
        scope_type:
          type: string
          const: folder
        scope_id:
          type: string
          example: folder-root
        folder_id:
          type: string
          example: folder-root
        path:
          type: string
          description: Canonical relpath for the folder scope, rooted at the shared data root
          example: ""
        label:
          type: string
          example: root-folder
      additionalProperties: false
        EditedTextSegment:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
          description: Stable canonical manifest segment identifier
          example: seg-000001
        text:
          type: string
          example: Corrected text for this segment.
      additionalProperties: false

    EditedTextStaleFlags:
      type: object
      required:
        - embeddings
        - search_chunks
      properties:
        embeddings:
          type: boolean
          example: true
        search_chunks:
          type: boolean
          example: true
      additionalProperties: false

    EditedTextReadResponse:
      type: object
      required:
        - file_id
        - exists
        - representation
        - segments
      properties:
        file_id:
          type: string
          example: sha256-test123
        exists:
          type: boolean
          example: true
        representation:
          type: string
          const: edited
        segments:
          type: array
          items:
            $ref: '#/components/schemas/EditedTextSegment'
      additionalProperties: false

    EditedTextWriteRequest:
      type: object
      required:
        - segments
      properties:
        segments:
