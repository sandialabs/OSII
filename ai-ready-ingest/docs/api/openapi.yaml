        '200':
          description: Edited text representation state and segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditedTextReadResponse'
              examples:
                exists:
                  value:
                    file_id: sha256-test123
                    exists: true
                    representation: edited
                    segments:
                      - id: seg-000001
                        text: Corrected text for this segment.
                missing:
                  value:
                    file_id: sha256-test123
                    exists: false
                    representation: edited
                    segments: []
        default:
          $ref: '#/components/responses/GenericError'

    put:
      tags:
        - objects
      summary: Replace edited text segments for an object
      description: |
        Writes the edited text representation for an object.

        Semantics:

        - canonical extracted text remains unchanged
        - edited text is stored separately
        - edited text becomes the preferred text representation when present
        - segment identifiers must correspond to canonical manifest segment identifiers
        - embeddings and search-derived chunks are marked stale after edits change text
      operationId: putEditedObjectText
      parameters:
