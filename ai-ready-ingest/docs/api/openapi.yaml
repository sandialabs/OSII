          example: true
        stale:
          $ref: '#/components/schemas/EditedTextStaleFlags'
      additionalProperties: false
      
    CollectionScopeDescriptor:
      type: object
      required:
        - scope_type
        - scope_id
        - collection_id
        - label
      properties:
        scope_type:
          type: string
