  /api/search:
    get:
      tags:
        - search
      summary: Public semantic search over derived chunks with canonical grounding fields
      description: |
        Simple compatibility search route.

        Searches over derived embedding chunks and returns retrieval-oriented results with canonical grounding coordinates.

        Important semantics:

        - this route is semantic-only
        - `faiss_id` is an internal retrieval identifier
        - `chunk_id` identifies a derived retrieval chunk, not a canonical extraction segment
        - `file_id`, `char_start`, and `char_end` are the canonical grounding fields most relevant for downstream navigation

        The preferred public route for richer scope-aware search is `POST /api/search`.
      operationId: search
      parameters:
        - $ref: '#/components/parameters/SearchQueryParam'
        - $ref: '#/components/parameters/TopKQueryParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                default:
                  value:
                    query: thermal calibration drift
                    top_k: 5
                    results:
                      - faiss_id: 0
                        chunk_id: chunk-sha256-test123-000001
                        file_id: sha256-test123
                        source_relpath: reports/example.pdf
                        chunk_method: paragraph
                        chunk_index: 1
                        char_start: 0
                        char_end: 38
                        source_text_representation: canonical
                        source_text_kind: canonical_extracted_text
                        truncated: false
                        score: 0.8123
                empty:
                  value:
                    query: thermal calibration drift
                    top_k: 5
                    results: []
        default:
          $ref: '#/components/responses/GenericError'

    post:
      tags:
        - search
      summary: Scope-aware search over derived chunks with selectable retrieval mode
      description: |
        Preferred public search route.

        Searches over derived retrieval units and returns richer result objects with canonical grounding coordinates and scope echo.

        Request semantics:

        - `query` is the free-text search query
        - `mode` selects retrieval behavior and defaults to `semantic`
        - `top_k` limits the number of returned results
        - `scope` restricts search to a supported scope
        - `group_by` controls result grouping behavior

        Supported scope request variants are:

        - root
        - folder by `folder_id`
        - collection by `collection_id`
        - object by `file_id`

        Important result semantics:

        - search may rank using derived chunks
        - `snippet` is intended to be the matched chunk text or grounded excerpt
        - canonical grounding fields remain `file_id`, `char_start`, and `char_end`
        - `source_origin` provides implementation-aligned grounding metadata for the matched result
        - when `group_by = file`, the backend returns one primary result per file based on the best hit in that file
        - `retrieval_mode_used` may differ from requested `mode` when hybrid degrades to lexical because semantic index artifacts are unavailable
      operationId: searchPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              grouped_by_file:
                value:
                  query: calibration drift
                  mode: hybrid
                  top_k: 10
                  scope:
                    scope_type: root
                  group_by: file
              object_semantic_default_mode:
                value:
                  query: calibration findings
                  top_k: 5
                  scope:
                    scope_type: object
                    file_id: sha256-test123
      responses:
        '200':
          description: Search results with echoed mode, actual retrieval mode used, scope, and grouping mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchScopedResponse'
              examples:
                default:
                  value:
                    query: calibration drift
                    mode: hybrid
                    retrieval_mode_used: lexical
                    top_k: 10
                    scope:
                      scope_type: root
                    group_by: file
                    results:
                      - file_id: sha256-...
                        filename: example.pdf
                        source_relpath: reports/example.pdf
                        snippet: Thermal calibration drift was reduced during the updated correction workflow...
                        score: 12.3
                        match_type: hybrid
                        chunk_id: chunk-sha256-...-000014
                        chunk_method: paragraph
                        chunk_index: 14
                        char_start: 1042
                        char_end: 1188
                        source_text_representation: canonical
                        source_text_kind: canonical_extracted_text
                        source_origin:
                          grounding_type: text_span
                          char_start: 1042
                          char_end: 1188
                        collections: []
                empty:
                  value:
                    query: calibration drift
                    mode: hybrid
                    retrieval_mode_used: lexical
                    top_k: 10
                    scope:
                      scope_type: root
                    group_by: file
                    results: []
        default:
          $ref: '#/components/responses/GenericError'

