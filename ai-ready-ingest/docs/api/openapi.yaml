                    representation: edited
                    removed: true
                    stale:
                      embeddings: true
                      search_chunks: true
                not_present:
                  value:
                    file_id: sha256-test123
                    representation: edited
                    removed: false
                    stale:
                      embeddings: true
                      search_chunks: true
        default:
          $ref: '#/components/responses/GenericError'

