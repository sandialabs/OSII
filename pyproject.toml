[project]
name = "osii-mcp"
version = "0.1.0"
description = "Coding documentation assistant with OSII source retrieval and a reusable, cited wiki."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "osii @ git+ssh://git@github.com/heidikmkv/osii-private.git@dd177922303463838b430f56684ae50c04f884d2#subdirectory=osii-core"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
osii-mcp = "osii_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["osii_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
