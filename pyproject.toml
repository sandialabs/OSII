[project]
name = "osii-monorepo"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[tool.uv.workspace]
exclude = ["osii-toolbox/*"]
members = [
  "osii-core",
  "osii-mcp",
  "osii-core/services/local-extractor",
  "osii-core/services/local-tesseract",
  "osii-core/services/local-synthesizer",
  "osii-core/services/local-embedder",
  "osii-core/services/local-enricher",
  "osii-core/services/model-provider-bridge",
]

[tool.uv.sources]
osii-processor-sdk = { path = "osii-core/processor-sdk", editable = true }
osii = { workspace = true }
