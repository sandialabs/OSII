[project]
name = "osii-monorepo"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[tool.uv.workspace]
members = [
  "ai-ready-ingest",
  "ai-ready-mcp",
  "ai-ready-rag-chat",
  "packages/osii-processor-sdk",
  "services/table-pdf-enricher",
  "services/local-extractor",
  "services/local-synthesizer",
  "services/local-embedder",
  "services/local-enricher",
  "services/model-provider-bridge",
]

[tool.uv.sources]
osii-processor-sdk = { workspace = true }
osii = { workspace = true }
