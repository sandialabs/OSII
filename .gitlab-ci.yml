# Product verification only. The previous image/installer/release pipeline is
# preserved on archive/workstation-deployment-2026-11-03.
stages: [verify]
default:
  tags: [osii-linux-amd64]
  interruptible: true
variables:
  OSII_PYTHON_VERSION: "3.12"
checks:
  stage: verify
  script:
    - make test
    - make docs
    - uv run --frozen --python 3.12 --package osii-mcp --extra dev python -m pytest osii-mcp/tests -q
