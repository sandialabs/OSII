[package]
name = "osii-launcher"
version = "0.1.0"
description = "Desktop deployment manager for OSII"
authors = ["OSII contributors"]
edition = "2021"

[lib]
name = "osii_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1", features = ["v4"] }
