[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osii-processor-sdk"
version = "0.1.0"
description = "Versioned contracts and service helpers for external OSII processors."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/osii_processor_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
