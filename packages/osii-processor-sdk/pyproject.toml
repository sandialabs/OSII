[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osii-processor-sdk"
version = "0.1.0"
description = "Versioned contracts and service helpers for external OSII processors."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
