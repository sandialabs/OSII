name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --package osii --extra dev
      - run: uv sync --package osii-processor-sdk --extra dev
      - run: uv run --package osii pytest ai-ready-ingest/tests packages/osii-processor-sdk/tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osii-dashboard/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: osii-dashboard/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile examples config --quiet
      - run: docker compose --profile examples build api dashboard table-pdf-enricher

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: python scripts/check_docs_links.py
      - run: mkdocs build --strict
