name: CI
on:
  pull_request:
  push:
    branches: [osii-server]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Isolated PostgreSQL test database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE osii_test LOGIN PASSWORD 'osii-test-only';"
          sudo -u postgres createdb -O osii_test osii_server_test
      - name: Server, retrieval, and SDK
        env:
          TEST_DATABASE_URL: postgresql+psycopg://osii_test:osii-test-only@localhost:5432/osii_server_test
        run: uv run --frozen --python 3.12 --package osii --extra server --extra dev python -m pytest osii-core/server-tests osii-core/processor-sdk/tests -q
      - name: Processor contracts
        run: |
          for service in local-extractor local-tesseract local-synthesizer local-embedder local-enricher model-provider-bridge; do
            uv run --isolated --no-project --python 3.12 --with-editable osii-core \
              --with-editable "osii-core/services/$service" --with pytest \
              --with 'httpx>=0.27,<1' python -m pytest "osii-core/services/$service/tests" -q || exit $?
          done
          uv run --isolated --no-project --python 3.12 --with pytest \
            --with 'uvicorn[standard]>=0.35,<1' python -m pytest \
            osii-core/services/baseline-processors/tests -q
      - name: Documentation
        run: make docs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: osii-dashboard/dashboard/package-lock.json
      - name: Dashboard
        working-directory: osii-dashboard/dashboard
        run: npm ci && npm test --if-present && npm run build
