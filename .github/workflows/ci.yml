name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Core and SDK
        run: uv run --frozen --python 3.12 --package osii --extra dev python -m pytest osii-core/tests osii-core/processor-sdk/tests -q
      - name: Isolated PostgreSQL read-contract database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE osii_read_test LOGIN PASSWORD 'osii-read-test-only';"
          sudo -u postgres createdb -O osii_read_test osii_reads_test
      - name: Shared sidecar and PostgreSQL read contracts
        env:
          OSII_READ_TEST_DATABASE_URL: postgresql+psycopg://osii_read_test:osii-read-test-only@localhost:5432/osii_reads_test
        run: uv run --frozen --python 3.12 --package osii --extra postgres --extra dev python -m pytest --noconftest osii-core/tests/test_library_reads.py osii-core/tests/test_processing_commits.py osii-core/tests/test_library_authoring.py osii-core/tests/test_retrieval_jobs.py osii-core/tests/test_text_authoring.py osii-core/tests/test_local_postgres.py -q
      - name: Shared RAG strategies
        run: uv run --frozen --python 3.12 --package osii --extra rag-haystack --extra dev python -m pytest osii-core/rag-tests osii-core/tests/test_rag_experiments_api.py -q
      - name: MCP
        run: uv run --frozen --python 3.12 --package osii-mcp --extra dev python -m pytest osii-mcp/tests -q
      - name: Processor contracts
        run: |
          for service in local-extractor local-tesseract local-synthesizer local-embedder local-enricher model-provider-bridge; do
            uv run --isolated --no-project --python 3.12 --with-editable osii-core \
              --with-editable "osii-core/services/$service" --with pytest \
              --with 'httpx>=0.27,<1' python -m pytest "osii-core/services/$service/tests" -q || exit $?
          done
          uv run --isolated --no-project --python 3.12 --with pytest \
            --with 'uvicorn[standard]>=0.35,<1' python -m pytest \
            osii-core/services/baseline-processors/tests -q
      - name: Banyan Toolbox adapter
        run: >-
          uv run --project osii-toolbox/banyan-nemotron-parse
          --with pytest --with 'httpx>=0.27,<1'
          python -m pytest osii-toolbox/banyan-ingest/tests/unit/test_osii_extractor.py
          -q --api-test-mode=mock
      - name: Documentation
        run: make docs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: osii-dashboard/dashboard/package-lock.json
      - name: Dashboard
        working-directory: osii-dashboard/dashboard
        run: npm ci && npm test --if-present && npm run build
