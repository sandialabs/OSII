name: CI
on:
  pull_request:
  push:
    branches: [main, osii-standalone, 'osii-standalone-sync/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Extension layout and naming
        run: python3 scripts/check_extensions.py
      - name: Core and SDK
        run: uv run --frozen --python 3.12 --package osii --extra dev python -m pytest osii-core/tests osii-core/processor-sdk/tests -q
      - name: Isolated PostgreSQL read-contract database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE osii_read_test LOGIN PASSWORD 'osii-read-test-only';"
          sudo -u postgres createdb -O osii_read_test osii_reads_test
      - name: Shared sidecar and PostgreSQL read contracts
        env:
          OSII_READ_TEST_DATABASE_URL: postgresql+psycopg://osii_read_test:osii-read-test-only@localhost:5432/osii_reads_test
        run: uv run --frozen --python 3.12 --package osii --extra postgres --extra dev python -m pytest --noconftest osii-core/tests/test_library_reads.py osii-core/tests/test_processing_commits.py osii-core/tests/test_library_authoring.py osii-core/tests/test_retrieval_jobs.py osii-core/tests/test_text_authoring.py osii-core/tests/test_local_postgres.py osii-core/tests/test_database_query.py -q
      - name: Shared RAG strategies
        run: uv run --frozen --python 3.12 --package osii --extra rag-haystack --extra dev python -m pytest osii-core/rag-tests osii-core/tests/test_rag_experiments_api.py -q
      - name: Processor contracts
        run: |
          for service in local-extractor local-tesseract local-synthesizer local-embedder local-enricher model-provider-bridge; do
            uv run --isolated --no-project --python 3.12 --with-editable osii-core \
              --with-editable "osii-core/services/$service" --with pytest \
              --with 'httpx>=0.27,<1' python -m pytest "osii-core/services/$service/tests" -q || exit $?
          done
          uv run --isolated --no-project --python 3.12 --with pytest \
            --with 'uvicorn[standard]>=0.35,<1' python -m pytest \
            osii-core/services/baseline-processors/tests -q
      - name: Discovered processor module contracts
        run: python3 scripts/check_extensions.py --test
      - name: Documentation
        run: make docs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: osii-dashboard/dashboard/package-lock.json
      - name: Dashboard
        working-directory: osii-dashboard/dashboard
        run: npm ci && npm test --if-present && npm run build
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install Chromium for browser tests
        run: uv run --frozen --python 3.12 --package osii --extra dev --with playwright==1.65.2 python -m playwright install --with-deps chromium
      - name: OSII-local workflows in Chromium
        run: uv run --frozen --python 3.12 --package osii --extra dev --with playwright==1.65.2 --with docx2txt==0.9 python -m pytest osii-dashboard/dashboard/tests/test_local_browser.py -q
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: local-browser-traces
          path: osii-dashboard/dashboard/.cache/browser/
          include-hidden-files: true
          if-no-files-found: ignore

  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Windows bootstrap and worker imports
        run: uv run --frozen --python 3.12 --package osii --extra dev python -m pytest --noconftest osii-core/tests/test_dev_stack_supervisor.py -q -k "worker_spawn or powershell or runtime_probe"
      - name: Windows Python and OCR processor contracts
        shell: pwsh
        run: |
          foreach ($service in @("local-extractor", "local-tesseract")) {
            uv run --isolated --no-project --python 3.12 --with-editable osii-core --with-editable "osii-core/services/$service" --with pytest --with "httpx>=0.27,<1" python -m pytest "osii-core/services/$service/tests" -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
